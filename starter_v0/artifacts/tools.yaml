tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi thêm thông tin từ người dùng khi thiếu dữ liệu bắt buộc (như asset_id, employee_id), hoặc yêu cầu người dùng xác nhận trước khi thực hiện hành động ghi (như tạo ticket)."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Nội dung câu hỏi cần làm rõ hoặc xác nhận."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu phản hồi mong đợi: 'yes_no' khi cần xác nhận, 'text' khi cần điền mã/thông tin."}
        options: {type: array, default: [], items: {type: string}, description: "Các phương án lựa chọn nếu response_type là choice."}
      required: [question]

  - name: search_kb
    description: "Tìm kiếm cẩm nang kỹ thuật và hướng dẫn xử lý sự cố (How-to, Troubleshooting). Không dùng để kiểm tra trạng thái dịch vụ hay chẩn đoán một máy cụ thể."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc câu hỏi cần tra cứu."}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Danh mục hướng dẫn kỹ thuật liên quan."}
        top_k: {type: integer, default: 3, description: "Số lượng bài viết kết quả cần lấy."}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái hoạt động của các dịch vụ dùng chung toàn tổ chức (VPN, Email, SSO, Wifi, Printing). Phải tôn trọng môi trường được yêu cầu (production hoặc staging)."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ dùng chung cần kiểm tra."}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường triển khai: 'production' hoặc 'staging'."}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra thông tin cấu hình và chẩn đoán kỹ thuật của một thiết bị cụ thể. Bắt buộc phải có mã tài sản (asset_id). Nếu người dùng chưa cung cấp mã máy, phải gọi clarify để hỏi."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản định danh thiết bị, ví dụ LT-204, PC-101."}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Thành phần chẩn đoán cụ thể cần kiểm tra."}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu thông tin nhân viên, tài khoản và danh sách thiết bị được cấp phát trong danh bạ hỗ trợ. Bắt buộc phải có mã nhân viên (employee_id)."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên, ví dụ EMP-1001, EMP-1003."}
      required: [employee_id]

  - name: format_incident_report
    description: "Định dạng các kết quả chẩn đoán đã có thành báo cáo sự cố chuẩn mực. Chỉ dùng khi đã có sẵn danh sách findings, không dùng để thu thập dữ liệu lại từ đầu."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Danh sách các phát hiện chẩn đoán đã thu thập được."
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo: brief (tóm tắt), technical (kỹ thuật chi tiết), handoff (bàn giao ca)."}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề của báo cáo sự cố."}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm kiếm thông tin công khai về một model thiết bị trên Internet. Chỉ truyền hãng và model công khai. Tuyệt đối không truyền mã máy (asset_id), mã nhân viên, serial number hay hostname nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất thiết bị (ví dụ: Lenovo, Dell, Apple)."}
        model: {type: string, description: "Tên model thương mại công khai (ví dụ: ThinkPad T14 Gen 4, MacBook Pro M2)."}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Mục đích tra cứu: thông số (specs), driver, hỗ trợ (support), hoặc độ tương thích."}
        max_results: {type: integer, default: 3, description: "Số lượng kết quả tìm kiếm tối đa."}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tra cứu các văn bản chính sách, quy định công nghệ thông tin và bảo mật nội bộ của Northstar Labs."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung hoặc từ khóa chính sách cần tìm."}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Lĩnh vực chính sách cần tra cứu."}
        top_k: {type: integer, default: 3, description: "Số lượng điều khoản liên quan cần lấy."}
      required: [query]

  - name: create_ticket
    description: "Tạo ticket yêu cầu hỗ trợ sự cố mới vào hệ thống. CHỈ ĐƯỢC GỌI khi người dùng đã xác nhận rõ ràng (confirmed=true). Nếu người dùng chưa xác nhận, phải dùng tool clarify để xin xác nhận trước."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Mô tả tóm tắt sự cố kỹ thuật."}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức độ ưu tiên của sự cố."}
        asset_id: {type: string, default: "", description: "Mã tài sản liên quan đến sự cố (nếu có)."}
        confirmed: {type: boolean, default: false, description: "Trạng thái xác nhận từ người dùng. Bắt buộc phải là true để tạo ticket thành công."}
      required: [summary]
